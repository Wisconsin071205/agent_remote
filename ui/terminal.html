<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人工终端 - VASPilot</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0e0c; --fg: #d8ded6; --dim: #7c877e; --line: #222a24; --accent: #8fc7a8; --warn: #d8a75f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.5 "Cascadia Code", "SFMono-Regular", Consolas, "Microsoft YaHei UI", monospace; }
    .wrap { display: flex; flex-direction: column; height: 100vh; }
    .bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 12px; }
    .bar strong { color: var(--accent); font-weight: 600; }
    .bar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
    .bar .dot.live { background: #57b98a; }
    .bar .hint { margin-left: auto; font-size: 11px; }
    #output { flex: 1; overflow-y: auto; padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .row { display: flex; gap: 10px; padding: 8px 14px; border-top: 1px solid var(--line); }
    .row .prompt { color: var(--accent); }
    #input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--fg); font: inherit; caret-color: var(--accent); }
    #status { color: var(--dim); font-size: 11px; padding: 0 14px 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <span class="dot" id="dot"></span>
      <span>人工终端 · <strong id="serverName">…</strong></span>
      <span class="hint">此终端仅限您本人操作，智能体不可见 · 关闭本窗口即断开</span>
    </div>
    <div id="output"></div>
    <div id="status">正在连接…</div>
    <div class="row"><span class="prompt">$</span><input id="input" autocomplete="off" spellcheck="false" placeholder="等待连接，输入密码与六位验证码…"></div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var server = params.get("server") || "";
      var termId = "";
      var csrf = "";
      var out = document.getElementById("output");
      var input = document.getElementById("input");
      var statusEl = document.getElementById("status");
      var dot = document.getElementById("dot");
      var closed = false;
      var timer = null;

      function post(path, body) {
        body.csrf = csrf;
        return fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        }).then(function (r) { return r.json(); });
      }

      function append(text) {
        if (!text) return;
        out.textContent += text;
        out.scrollTop = out.scrollHeight;
        // Switch the input to hidden mode while a password prompt is on screen.
        if (/assword|验证码|Verification code/i.test(out.textContent.slice(-120))) {
          input.type = "password";
        } else if (input.type === "password" && /\\$\s*$|\]\$\s*$/.test(out.textContent.slice(-60))) {
          input.type = "text";
        }
      }

      function poll() {
        if (closed || !termId) return;
        post("/api/term/output", { term_id: termId }).then(function (r) {
          if (!r || r.ok === false) {
            statusEl.textContent = r && r.error ? r.error : "会话已结束";
            if (r && r.alive === false) {
              dot.classList.remove("live");
              clearInterval(timer);
              closed = true;
              input.disabled = true;
            }
            return;
          }
          append(r.data);
          if (r.alive) { dot.classList.add("live"); statusEl.textContent = "已连接"; }
          else { dot.classList.remove("live"); statusEl.textContent = "会话已结束（可关闭本窗口）"; }
        }).catch(function () { /* transient */ });
      }

      input.addEventListener("keydown", function (event) {
        if (event.key !== "Enter") return;
        event.preventDefault();
        var data = input.value + "\\n";
        input.value = "";
        if (!termId || closed) return;
        post("/api/term/input", { term_id: termId, data: data }).then(function (r) {
          if (r && r.ok === false) statusEl.textContent = r.error || "输入失败";
        });
      });

      fetch("/api/health").then(function (r) { return r.json(); }).then(function (h) {
        csrf = h.csrf || "";
        document.getElementById("serverName").textContent = server || "默认";
        return post("/api/terminal", { name: server });
      }).then(function (r) {
        if (!r || r.ok === false) {
          statusEl.textContent = "打开终端失败: " + (r && r.error ? r.error : "未知错误");
          return;
        }
        termId = r.term_id;
        statusEl.textContent = "会话已建立，正在连接 " + server + "…";
        timer = setInterval(poll, 300);
        input.focus();
      }).catch(function (err) {
        statusEl.textContent = "打开终端失败: " + err.message;
      });

      window.addEventListener("beforeunload", function () {
        if (termId) {
          closed = true;
          try { navigator.sendBeacon("/api/term/close", new Blob([JSON.stringify({ term_id: termId, csrf: csrf })], { type: "application/json" })); } catch (e) { /* best effort */ }
        }
      });
    })();
  </script>
</body>
</html>
